name: Release

# Push a version tag (e.g. `v0.1.0`) to publish a draft GitHub release with the
# static site bundle and push the multi-arch Docker image to GitHub Packages.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write # create the draft release
  packages: write # push the image to ghcr.io

jobs:
  # Build the static site bundle that is attached to the release.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build (static SPA)
        run: pnpm run generate
      - name: Package the bundle
        run: |
          mkdir -p release
          tar -C .output/public -czf "release/nia-gov42-${GITHUB_REF_NAME}.tar.gz" .
      - uses: actions/upload-artifact@v7
        with:
          name: release-bundles
          path: release/*.tar.gz
          if-no-files-found: error

  # Build and push the multi-arch image (linux/amd64 + linux/arm64).
  docker:
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker-build.yml
    with:
      tags: |
        type=ref,event=tag
        type=raw,value=latest

  # Create the draft release once the image and bundle are ready.
  release:
    needs: [build, docker]
    runs-on: ubuntu-latest
    steps:
      - name: Download the bundle
        uses: actions/download-artifact@v8
        with:
          name: release-bundles
          path: release
      - uses: softprops/action-gh-release@v3
        with:
          draft: true
          generate_release_notes: true
          files: release/*.tar.gz

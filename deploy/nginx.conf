# nginx configuration for the NIA portal (static hosting).
#
# Build with `pnpm generate` and serve the generated directory:
#   root /var/www/nia-gov42;   # copy of .output/public

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name nia.gov.dn42;

    root /var/www/nia-gov42;
    index index.html;

    # dn42 TLS certificate (see docs/DEPLOYMENT.md).
    ssl_certificate     /etc/ssl/nia.gov.dn42/fullchain.pem;
    ssl_certificate_key /etc/ssl/nia.gov.dn42/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Security headers.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # The app ships a small inline script (colour-mode bootstrap) and Naive UI
    # injects inline styles, hence 'unsafe-inline' for script/style.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; font-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # The app is a client-rendered SPA: each route has a shell index.html and
    # unknown routes fall back to the 200.html shell (which renders the app's
    # own not-found page).
    location / {
        try_files $uri $uri/ $uri.html /200.html;
    }

    # Hashed build assets are immutable.
    location ~* ^/_nuxt/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location = /robots.txt {
        access_log off;
    }
}
